/* Hausstil gedacht.gemacht: Tokens aus zähler, dunkel ist Standard, hell per Systemeinstellung oder data-theme */
:root{
  --bg:#0d0d10; --s1:#15151a; --s2:#1c1c23; --s3:#25252e; --line:#2a2a33;
  --tx:#ecebf2; --mu:#8b8a97; --mu2:#5f5e6a;
  --ac:#9b8afb; --ac2:#7d6bf0; --acbg:rgba(155,138,251,.13);
  --ok:#5fd39a; --okbg:rgba(95,211,154,.13);
  --wa:#f2c25c; --wabg:rgba(242,194,92,.13);
  --ba:#f2777a; --babg:rgba(242,119,122,.13);
  --r:14px; --r2:10px;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --navh:64px;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#f6f5f9; --s1:#ffffff; --s2:#f0eef6; --s3:#e5e2ef; --line:#e1dfe9;
  --tx:#17161c; --mu:#6c6a78; --mu2:#9a98a6;
  --ac:#6d5ae6; --ac2:#5a47d6; --acbg:rgba(109,90,230,.10);
  --ok:#1f9d63; --okbg:rgba(31,157,99,.10);
  --wa:#b7820f; --wabg:rgba(183,130,15,.11);
  --ba:#d6454a; --babg:rgba(214,69,74,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme=dark]){
    --bg:#f6f5f9; --s1:#ffffff; --s2:#f0eef6; --s3:#e5e2ef; --line:#e1dfe9;
    --tx:#17161c; --mu:#6c6a78; --mu2:#9a98a6;
    --ac:#6d5ae6; --ac2:#5a47d6; --acbg:rgba(109,90,230,.10);
    --ok:#1f9d63; --okbg:rgba(31,157,99,.10);
    --wa:#b7820f; --wabg:rgba(183,130,15,.11);
    --ba:#d6454a; --babg:rgba(214,69,74,.10);
    color-scheme:light;
  }
}
.brand{font:600 20px/1 var(--mono);letter-spacing:-.02em}
.brand b{color:var(--ac);font-weight:600}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}
a{color:var(--ac)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:24px}
h2{font-size:18px}
.mono{font-family:var(--mono)}
.mu{color:var(--mu)}
.klein{font:12px/1.4 var(--mono);color:var(--mu);text-transform:lowercase}
[hidden]{display:none !important}

header.kopf{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 16px;height:56px}
header.kopf .brand{text-decoration:none;color:var(--tx)}
header.kopf .status{margin-left:auto;font:12px var(--mono);color:var(--mu)}
nav.leiste{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--navh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--s1);border-top:1px solid var(--line);display:flex}
nav.leiste a{flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;text-decoration:none;
  color:var(--mu);font:13px var(--mono);text-transform:lowercase}
nav.leiste a[aria-current=page]{color:var(--ac)}
main{max-width:1240px;margin:0 auto;padding:16px 16px calc(var(--navh) + 96px)}

.knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r2);
  border:1px solid var(--line);background:var(--s2);color:var(--tx);font:500 14px var(--mono);text-transform:lowercase;cursor:pointer;text-decoration:none}
.knopf:hover{border-color:var(--mu2)}
.knopf.haupt{background:var(--ac);border-color:var(--ac);color:#0d0d10}
[data-theme=light] .knopf.haupt{color:#fff}
@media (prefers-color-scheme: light){:root:not([data-theme=dark]) .knopf.haupt{color:#fff}}
.knopf.leise{background:transparent}
.knopf.warn{color:var(--ba)}
.knopf:disabled{opacity:.45;cursor:not-allowed}
.knopf.mini{min-height:44px;min-width:44px;padding:0 12px}
.reihe{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.feld{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.feld label,.feld .lbl{font:12px var(--mono);color:var(--mu);text-transform:lowercase}
input[type=text],input[type=date],input[type=number],input:not([type]),select{width:100%;min-height:48px;padding:0 12px;border-radius:var(--r2);
  border:1px solid var(--line);background:var(--s1);color:var(--tx);min-width:0}
textarea{width:100%;min-height:96px;padding:10px 12px;border-radius:var(--r2);border:1px solid var(--line);background:var(--s1);color:var(--tx);
  font:16px/1.35 var(--mono);resize:vertical;overflow-wrap:anywhere;word-break:break-all;min-width:0;display:block}
.schritte{margin:0 0 14px;padding-left:22px;color:var(--mu);font-size:15px}
.schritte li + li{margin-top:6px}
textarea:focus,input:focus,select:focus,.knopf:focus-visible,.kachel:focus-visible,.gk:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.karte{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.karte + .karte{margin-top:12px}
.karte h2{margin-bottom:12px}
.tag{display:inline-block;font:11px/1 var(--mono);text-transform:lowercase;padding:4px 6px;border-radius:6px;background:var(--acbg);color:var(--ac);vertical-align:middle}
.tag.grau{background:var(--s3);color:var(--mu)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.hinweis{background:var(--acbg);border-radius:var(--r2);padding:12px 14px;font-size:14px}
.hinweis.warn{background:var(--wabg)}
.leer{text-align:center;padding:40px 16px}
.leer p{color:var(--mu);margin:8px 0 20px}

/* Liste */
.liste{display:block}
.beispielband{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kachel{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:96px;padding:14px;
  border-radius:var(--r);border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:left;min-width:0}
.kachel .nm{font-weight:600;font-size:17px;overflow-wrap:anywhere;line-height:1.2}
.kachel .sm{font:15px var(--mono);color:var(--mu)}
.kachel .sm.pos{color:var(--tx)}
.kachel[aria-pressed=true]{border-color:var(--ac);background:var(--acbg)}
.exportzeile{margin-top:16px}

.blatt-hg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.blatt{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--s1);border-top:1px solid var(--line);
  border-radius:var(--r) var(--r) 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.blatt .kopfz{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.blatt .kopfz h2{overflow-wrap:anywhere;min-width:0}
.blatt .kopfz .knopf{margin-left:auto}
.gks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gk{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:80px;padding:14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--s2);cursor:pointer;text-align:left;min-width:0}
.gk .nm{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.gk .pr{font:14px var(--mono);color:var(--mu)}
.gk:active{background:var(--acbg);border-color:var(--ac)}
.blatt .fuss{margin-top:12px}

/* Tabellen */
.zeilen{display:flex;flex-direction:column}
.zeile{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line);padding:6px 0;min-width:0}
.zeile:last-child{border-bottom:0}
.zeile .wer{flex:1;min-width:0;overflow-wrap:anywhere}
.zeile .zahl{font-family:var(--mono);white-space:nowrap}
.zeile.storno .wer,.zeile.storno .zahl{text-decoration:line-through;color:var(--mu2)}
details.pz{border-bottom:1px solid var(--line)}
details.pz summary{display:flex;align-items:center;gap:10px;min-height:52px;cursor:pointer;list-style:none}
details.pz summary::-webkit-details-marker{display:none}
details.pz summary::before{content:'›';font-family:var(--mono);color:var(--mu);width:12px;transition:transform .15s}
details.pz[open] summary::before{transform:rotate(90deg)}
details.pz summary .wer{flex:1;min-width:0;overflow-wrap:anywhere}
details.pz .innen{padding:0 0 10px 22px;font-size:14px}
details.pz .innen .zeile{min-height:36px;border:0;padding:2px 0}
.gesamt{display:flex;justify-content:space-between;align-items:center;padding-top:12px;font-weight:600}
.gesamt .zahl{font:600 18px var(--mono)}
.gross{font:600 32px/1.1 var(--mono);margin:6px 0 2px}
.abschluss{margin-top:12px;border:1px solid var(--line);border-radius:var(--r2);padding:12px}
.abschluss .kopfz{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:6px}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;flex:1;min-width:0}
.chk input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.seg button{flex:1;min-height:48px;border:0;background:var(--s1);font:13px var(--mono);text-transform:lowercase;cursor:pointer;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--acbg);color:var(--ac)}
.gzeile{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.gzeile:last-child{border-bottom:0}
.gzeile .akt{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vorschlag{font:14px var(--mono);margin:8px 0}
.zurueck{display:inline-flex;align-items:center;min-height:44px;font:13px var(--mono);color:var(--mu);text-decoration:none;text-transform:lowercase}
.spalten{display:block}

/* Toast und Dialog */
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + 12px + env(safe-area-inset-bottom));z-index:40;max-width:520px;margin:0 auto;
  background:var(--s3);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);overflow:hidden}
.toast .tx{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.toast .balken{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);width:100%;transform-origin:left}
.toast.laeuft .balken{animation:ab 10s linear forwards}
@keyframes ab{to{transform:scaleX(0)}}
.dlg-hg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:420px;width:100%}
.dlg p{margin:0 0 16px;overflow-wrap:anywhere}
.dlg .reihe{justify-content:flex-end}

@media (min-width:600px){
  .raster{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gks{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:1280px){
  nav.leiste{position:static;height:56px;background:transparent;border:0;padding:0;margin-left:24px;gap:4px}
  nav.leiste a{flex:none;padding:0 14px}
  header.kopf{height:64px;padding:0 24px}
  main{padding:24px 24px 120px}
  .toast{bottom:24px}
  .liste{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;align-items:start}
  .raster{grid-template-columns:repeat(3,minmax(0,1fr))}
  .blatt-hg{display:none !important}
  .blatt{position:sticky;top:88px;border:1px solid var(--line);border-radius:var(--r);max-height:none;padding:16px;display:block !important}
  .spalten{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .spalten > .karte + .karte,.spalten > div > .karte + .karte{margin-top:0}
  .spalten > div{display:flex;flex-direction:column;gap:12px}
}
</style>
</head>
<body>
<header class="kopf">
  <a class="brand" href="#liste">strich<b>.</b></a>
  <nav class="leiste" id="nav" aria-label="Bereiche">
    <a href="#liste" data-v="liste">liste</a>
    <a href="#abrechnung" data-v="abrechnung">abrechnung</a>
    <a href="#einstellungen" data-v="einstellungen">einstellungen</a>
  </nav>
  <span class="status" id="status"></span>
</header>
<main id="app" aria-live="polite"></main>
<div id="toast" class="toast" role="status" hidden><span class="tx"></span><button class="knopf mini" type="button">rückgängig</button><span class="balken"></span></div>
<div id="dlg" class="dlg-hg" hidden><div class="dlg" role="dialog" aria-modal="true"><p></p><div class="reihe"><button class="knopf leise" type="button" data-a="nein">abbrechen</button><button class="knopf haupt" type="button" data-a="ja">ok</button></div></div></div>

<script src="src/rechnen.js"></script>
<script src="src/abgleich.js"></script>
<script>
'use strict';
const R = window.Rechnen;
const Ab = window.Abgleich;

/* ---------- Speicher: IndexedDB, Datenbank strich, Schema 1 ---------- */
const DB_NAME = 'strich';
const DB_VERSION = 1;
const STORES = ['personen', 'getraenke', 'striche', 'abschluesse', 'meta'];
let db = null;
let speicherOk = true;

function oeffneDb() {
  return new Promise((ok, fehler) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = r.result;
      // Migrationen schrittweise je Version
      if (e.oldVersion < 1) {
        for (const s of STORES) d.createObjectStore(s, { keyPath: 'id' });
      }
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => fehler(r.error);
    r.onblocked = () => fehler(new Error('blockiert'));
  });
}
function tx(stores, modus, arbeit) {
  if (!db) return Promise.resolve();
  return new Promise((ok, fehler) => {
    const t = db.transaction(stores, modus);
    const erg = arbeit(t);
    t.oncomplete = () => ok(erg);
    t.onerror = () => fehler(t.error);
    t.onabort = () => fehler(t.error);
  });
}
function alleLesen(store) {
  return new Promise((ok, fehler) => {
    const r = db.transaction(store).objectStore(store).getAll();
    r.onsuccess = () => ok(r.result || []);
    r.onerror = () => fehler(r.error);
  });
}
const speichere = (store, ...objs) => tx([store], 'readwrite', t => { for (const o of objs) t.objectStore(store).put(o); });
const loesche = (store, id) => tx([store], 'readwrite', t => t.objectStore(store).delete(id));
const speichereMeta = () => speichere('meta', Object.assign({ id: 'meta' }, D.meta));
function ersetzeAlles(daten) {
  return tx(STORES, 'readwrite', t => {
    for (const s of STORES) t.objectStore(s).clear();
    for (const s of R.STORES) for (const o of daten[s]) t.objectStore(s).put(o);
    t.objectStore('meta').put(Object.assign({ id: 'meta' }, daten.meta));
  });
}

/* ---------- Zustand ---------- */
const D = { personen: [], getraenke: [], striche: [], abschluesse: [], meta: { schemaVersion: 1, demoGeladen: false, letzterExport: null } };
let auswahl = null;         // Person, für die gerade ein Strich gesetzt wird
let zr = { modus: 'offen', von: '', bis: '' };
let importVorschau = null;
const neueId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const nachName = (a, b) => a.name.localeCompare(b.name, 'de');
const nachReihe = (a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0);
const person = id => D.personen.find(p => p.id === id);
const getraenk = id => D.getraenke.find(g => g.id === id);
const hatBeispiel = () => D.personen.some(p => p.beispiel) || D.getraenke.some(g => g.beispiel);

async function laden() {
  try {
    db = await oeffneDb();
    for (const s of R.STORES) D[s] = await alleLesen(s);
    const m = (await alleLesen('meta')).find(x => x.id === 'meta');
    if (m) { delete m.id; D.meta = Object.assign(D.meta, m); }
    else await speichereMeta();
  } catch (e) {
    db = null;
    speicherOk = false;
  }
}

/* ---------- Hilfen ---------- */
function el(tag, attr, ...kinder) {
  const e = document.createElement(tag);
  if (attr) for (const k in attr) {
    const v = attr[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kinder.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const z2 = n => String(n).padStart(2, '0');
function fmtDatum(iso) { const d = new Date(iso); return z2(d.getDate()) + '.' + z2(d.getMonth() + 1) + '.' + d.getFullYear(); }
function fmtZeit(iso) { const d = new Date(iso); return z2(d.getDate()) + '.' + z2(d.getMonth() + 1) + '. ' + z2(d.getHours()) + ':' + z2(d.getMinutes()); }
const euro = R.formatEuro;
const offen = () => R.offeneStriche(D.striche);

function herunterladen(name, text, typ) {
  const url = URL.createObjectURL(new Blob([text], { type: typ }));
  const a = el('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

let toastTimer = null;
function toast(text, rueckgaengig) {
  const t = document.getElementById('toast');
  t.querySelector('.tx').textContent = text;
  const k = t.querySelector('button');
  k.hidden = !rueckgaengig;
  k.onclick = async () => { verbergeToast(); if (rueckgaengig) await rueckgaengig(); };
  t.hidden = false;
  t.classList.remove('laeuft'); void t.offsetWidth; t.classList.toggle('laeuft', !!rueckgaengig);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(verbergeToast, rueckgaengig ? 10000 : 3500);
}
function verbergeToast() { clearTimeout(toastTimer); document.getElementById('toast').hidden = true; }

function frage(text, jaText) {
  return new Promise(ok => {
    const h = document.getElementById('dlg');
    h.querySelector('p').textContent = text;
    const ja = h.querySelector('[data-a=ja]');
    ja.textContent = jaText || 'ok';
    h.hidden = false;
    ja.focus();
    h.onclick = e => {
      const a = e.target.dataset && e.target.dataset.a;
      if (a || e.target === h) { h.hidden = true; h.onclick = null; ok(a === 'ja'); }
    };
  });
}

let persistGefragt = false;
function persistAnfragen() {
  if (persistGefragt || !navigator.storage || !navigator.storage.persist) return;
  persistGefragt = true;
  navigator.storage.persist().catch(() => {});
}

/* ---------- Aktionen ---------- */
async function setzeStrich(pid, gid) {
  const p = person(pid), g = getraenk(gid);
  if (!p || !g) return;
  const s = { id: neueId(), personId: pid, getraenkId: gid, preisCent: g.preisCent, zeit: new Date().toISOString(), storniert: false, abschlussId: null };
  D.striche.push(s);
  await speichere('striche', s);
  auswahl = null;
  zeige();
  persistAnfragen();
  toast(p.name + ': ' + g.name + ' ' + euro(s.preisCent), async () => {
    D.striche = D.striche.filter(x => x.id !== s.id);
    await loesche('striche', s.id);
    zeige();
    toast('Strich für ' + p.name + ' entfernt.');
  });
}

async function stornoUmschalten(sid) {
  const s = D.striche.find(x => x.id === sid);
  if (!s || s.abschlussId) return;
  s.storniert = !s.storniert;
  await speichere('striche', s);
  zeige();
}

async function personAnlegen(name) {
  name = name.trim();
  if (!name) return null;
  const p = { id: neueId(), name, archiviert: false, beispiel: false, erstellt: new Date().toISOString() };
  D.personen.push(p);
  await speichere('personen', p);
  return p;
}

async function getraenkAnlegen(name, preisCent) {
  name = name.trim();
  if (!name || preisCent === null) return null;
  const max = D.getraenke.reduce((m, g) => Math.max(m, g.reihenfolge || 0), -1);
  const g = { id: neueId(), name, preisCent, archiviert: false, beispiel: false, reihenfolge: max + 1 };
  D.getraenke.push(g);
  await speichere('getraenke', g);
  return g;
}

async function demoLaden() {
  const demo = R.demoDaten(new Date(), neueId);
  const max = D.getraenke.reduce((m, g) => Math.max(m, g.reihenfolge || 0), -1);
  demo.getraenke.forEach((g, i) => { g.reihenfolge = max + 1 + i; });
  D.personen.push(...demo.personen);
  D.getraenke.push(...demo.getraenke);
  D.striche.push(...demo.striche);
  D.meta.demoGeladen = true;
  await speichere('personen', ...demo.personen);
  await speichere('getraenke', ...demo.getraenke);
  await speichere('striche', ...demo.striche);
  await speichereMeta();
  zeige();
  toast('Beispieldaten geladen.');
}

async function demoEntfernen() {
  const sauber = R.ohneBeispiel(D);
  const weg = (a, b) => a.length - b.length;
  const bleibt = D.personen.filter(p => p.beispiel).length - weg(D.personen, sauber.personen)
    + D.getraenke.filter(g => g.beispiel).length - weg(D.getraenke, sauber.getraenke);
  let text = 'Entfernt werden ' + weg(D.personen, sauber.personen) + ' Beispielpersonen, '
    + weg(D.getraenke, sauber.getraenke) + ' Beispielgetränke und ' + weg(D.striche, sauber.striche) + ' Beispielstriche';
  const abWeg = weg(D.abschluesse, sauber.abschluesse);
  if (abWeg) text += ', dazu ' + abWeg + (abWeg === 1 ? ' Abschluss' : ' Abschlüsse') + ' nur mit Beispielstrichen';
  text += '. Deine eigenen Striche bleiben.';
  if (bleibt) text += ' ' + bleibt + (bleibt === 1 ? ' Beispieleintrag hat' : ' Beispieleinträge haben') + ' eigene Striche und bleiben als eigene erhalten.';
  text += ' Das lässt sich nicht rückgängig machen.';
  if (!await frage(text, 'entfernen')) return;
  sauber.meta = Object.assign({}, D.meta, { demoGeladen: false });
  Object.assign(D, sauber);
  auswahl = null;
  await ersetzeAlles(D);
  zeige();
  toast('Beispieldaten entfernt.');
}

function exportieren() {
  const jetzt = new Date();
  const obj = R.exportObjekt(D, jetzt.toISOString());
  herunterladen(R.exportDateiname(jetzt), JSON.stringify(obj, null, 2), 'application/json');
  D.meta.letzterExport = jetzt.toISOString();
  speichereMeta();
  zeige();
}

function importLesen(datei) {
  const r = new FileReader();
  r.onload = () => {
    let obj;
    try { obj = JSON.parse(r.result); } catch (e) { obj = null; }
    const erg = obj ? R.pruefeImport(obj) : { ok: false, fehler: 'Die Datei ist kein gültiges JSON.' };
    importVorschau = erg;
    zeige();
  };
  r.readAsText(datei);
}

async function importAusfuehren() {
  if (!importVorschau || !importVorschau.ok) return;
  const d = importVorschau.daten;
  const meta = Object.assign({ demoGeladen: false }, d.meta, { letzterExport: D.meta.letzterExport });
  delete meta.id;
  const neu = { personen: d.personen, getraenke: d.getraenke, striche: d.striche, abschluesse: d.abschluesse, meta };
  Object.assign(D, neu);
  importVorschau = null;
  auswahl = null;
  await ersetzeAlles(D);
  zeige();
  toast('Daten importiert.');
}

function zeitraumGrenzen() {
  if (zr.modus !== 'zeitraum') return { von: null, bis: null };
  const teile = s => s.split('-').map(Number);
  let von = null, bis = null;
  if (zr.von) { const [y, m, d] = teile(zr.von); von = new Date(y, m - 1, d, 0, 0, 0, 0).toISOString(); }
  if (zr.bis) { const [y, m, d] = teile(zr.bis); bis = new Date(y, m - 1, d, 23, 59, 59, 999).toISOString(); }
  return { von, bis };
}
function abrechnungsStriche() {
  const g = zeitraumGrenzen();
  return R.imZeitraum(offen(), g.von, g.bis);
}

async function abschliessen() {
  const s = abrechnungsStriche();
  if (!s.length) return;
  const erg = R.abrechnung(s, D.personen, D.getraenke);
  const ja = await frage(erg.anzahl + ' Striche, zusammen ' + euro(erg.gesamtCent) + ', abschließen? Die Liste beginnt danach für alle bei 0,00 €.', 'abschließen');
  if (!ja) return;
  const g = zeitraumGrenzen();
  const jetzt = new Date().toISOString();
  const zeiten = s.map(x => x.zeit).sort();
  const abschluss = { id: neueId(), von: g.von || zeiten[0], bis: g.bis || jetzt, erstellt: jetzt, bezahlt: {} };
  const r = R.abschliessen(D.striche, abschluss);
  D.striche = r.striche;
  D.abschluesse.push(r.abschluss);
  await speichere('striche', ...r.geaendert);
  await speichere('abschluesse', r.abschluss);
  zeige();
  toast('Abrechnung abgeschlossen.');
}

function csvExport(striche, datum) {
  const erg = R.abrechnung(striche, D.personen, D.getraenke);
  herunterladen('strich-abrechnung-' + R.datumTeil(datum) + '.csv', R.abrechnungCsv(erg, D.getraenke), 'text/csv;charset=utf-8');
}

/* ---------- Mehrere Handys: Abgleich per Link ---------- */
let eingang = null;      // geprüfter Link, der auf Übernahme wartet
let meinLink = '';       // zuletzt erzeugter Link dieses Geräts

async function linkErzeugen() {
  const code = await Ab.kodieren(Ab.paketBauen(D, new Date().toISOString()));
  meinLink = location.href.split('#')[0] + Ab.MARKE + code;
  return meinLink;
}

async function linkTeilen() {
  const url = await linkErzeugen();
  zeige();
  if (navigator.share) {
    try { await navigator.share({ title: 'strich.', text: 'Strichliste für heute Abend, öffne den Link und tippe auf übernehmen:', url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  await linkKopieren();
}

async function linkKopieren() {
  const url = meinLink || await linkErzeugen();
  try { await navigator.clipboard.writeText(url); toast('Link kopiert. Schick ihn an die anderen Handys.'); }
  catch (e) {
    zeige();
    const f = document.getElementById('meinLink');
    if (f) { f.focus(); f.select(); }
    toast('Kopieren klappt hier nicht. Markiere den Link im Feld und kopiere ihn selbst.');
  }
}

async function eingangLesen(text) {
  const r = await Ab.dekodieren(text);
  if (r.ok) r.bericht = Ab.zusammenfuehren(D, r.daten).bericht;
  eingang = r;
  if (location.hash !== '#teilen') location.hash = '#teilen';
  else zeige();
}

async function eingangUebernehmen() {
  if (!eingang || !eingang.ok) return;
  const r = Ab.zusammenfuehren(D, eingang.daten);
  if (r.geaendert.personen.length) await speichere('personen', ...r.geaendert.personen);
  if (r.geaendert.getraenke.length) await speichere('getraenke', ...r.geaendert.getraenke);
  if (r.geaendert.striche.length) await speichere('striche', ...r.geaendert.striche);
  D.personen = r.daten.personen; D.getraenke = r.daten.getraenke; D.striche = r.daten.striche;
  eingang = null;
  meinLink = '';
  const b = r.bericht;
  const n = (k, eins, viele) => k + ' ' + (k === 1 ? eins : viele);
  toast('Übernommen: ' + [n(b.neueStriche, 'Strich', 'Striche'), n(b.neuStorniert, 'Storno', 'Stornos'),
    n(b.neuePersonen, 'Person', 'Personen'), n(b.neueGetraenke, 'Getränk', 'Getränke')].join(', ') + '.');
  location.hash = '#liste';
}

/* ---------- Ansichten ---------- */
function zeige() {
  const app = document.getElementById('app');
  const h = (location.hash || '#liste').slice(1).split('/');
  let v = h[0];
  if (v === 'abgleich') {
    // Code aus der Adresse nehmen, damit er nicht im Verlauf hängen bleibt
    const text = location.hash;
    history.replaceState(null, '', location.href.split('#')[0] + '#teilen');
    eingang = { laedt: true };
    eingangLesen(text);
    v = 'teilen';
  }
  if (!['liste', 'person', 'abrechnung', 'einstellungen', 'teilen'].includes(v)) v = 'liste';
  for (const a of document.querySelectorAll('#nav a')) {
    if (a.dataset.v === v || (v === 'person' && a.dataset.v === 'liste')) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
  document.getElementById('status').textContent = speicherOk ? '' : 'nur im speicher';
  const inhalt = v === 'person' ? ansichtPerson(decodeURIComponent(h[1] || ''))
    : v === 'abrechnung' ? ansichtAbrechnung()
    : v === 'einstellungen' ? ansichtEinstellungen()
    : v === 'teilen' ? ansichtTeilen()
    : ansichtListe();
  const kinder = [];
  if (!speicherOk) kinder.push(el('p', { class: 'hinweis warn' }, 'Der Browser erlaubt hier keinen dauerhaften Speicher. Deine Striche gehen beim Schließen verloren. Exportiere vorher.'));
  kinder.push(inhalt);
  app.replaceChildren(...kinder);
}

function ansichtListe() {
  const aktiv = D.personen.filter(p => !p.archiviert).sort(nachName);
  if (!aktiv.length) {
    return el('section', { class: 'leer' },
      el('h1', null, 'Noch niemand auf der Liste'),
      el('p', null, 'Leg die Leute an, die mittrinken, und die Getränke mit Preis. Dann reicht ein Tipp pro Strich.'),
      el('div', { class: 'reihe', style: 'justify-content:center' },
        el('a', { class: 'knopf haupt', href: '#einstellungen', onclick: () => setTimeout(() => { const f = document.getElementById('neuePerson'); if (f) f.focus(); }, 0) }, 'person anlegen'),
        el('button', { class: 'knopf', type: 'button', onclick: demoLaden }, 'beispiel laden'),
        el('a', { class: 'knopf', href: '#teilen' }, 'einladung öffnen')));
  }
  const o = offen();
  const links = el('div', null);
  if (hatBeispiel()) {
    links.append(el('div', { class: 'beispielband hinweis' },
      el('span', { class: 'tag' }, 'beispiel'),
      el('span', { style: 'flex:1;min-width:0' }, 'Erfundene Beispieldaten sind geladen.'),
      el('button', { class: 'knopf mini', type: 'button', onclick: demoEntfernen }, 'beispiel entfernen')));
  }
  links.append(el('div', { class: 'raster' }, aktiv.map(p => {
    const sum = R.summePerson(o, p.id);
    return el('button', { class: 'kachel', type: 'button', 'aria-pressed': String(auswahl === p.id), 'data-person': p.id,
      onclick: () => { auswahl = auswahl === p.id ? null : p.id; zeige(); } },
      el('span', { class: 'nm' }, p.name, p.beispiel ? [' ', el('span', { class: 'tag' }, 'beispiel')] : null),
      el('span', { class: 'sm' + (sum ? ' pos' : '') }, euro(sum)));
  })));
  const le = D.meta.letzterExport;
  links.append(el('div', { class: 'reihe', style: 'margin-top:16px' },
    el('a', { class: 'knopf', href: '#teilen', id: 'zuTeilen' }, 'mehrere handys')));
  links.append(el('p', { class: 'klein exportzeile' },
    'letzter export: ' + (le ? fmtDatum(le) : 'noch nie') + ' · ',
    el('a', { href: '#einstellungen' }, 'sichern')));

  const teile = [links];
  const breit = matchMedia('(min-width:1280px)').matches;
  if (auswahl && !person(auswahl)) auswahl = null;
  if (auswahl || breit) {
    if (auswahl && !breit) teile.push(el('div', { class: 'blatt-hg', onclick: () => { auswahl = null; zeige(); } }));

    vorschau = importVorschau.ok
      ? el('div', { class: 'hinweis warn', style: 'margin-top:12px' },
          el('p', { style: 'margin:0 0 10px' }, 'Die Datei enthält ' + importVorschau.vorschau.personen + ' Personen, ' + importVorschau.vorschau.getraenke + ' Getränke und ' + importVorschau.vorschau.striche + ' Striche. Import ersetzt alle Daten auf diesem Gerät.'),
          el('div', { class: 'reihe' },
            el('button', { class: 'knopf haupt', type: 'button', onclick: importAusfuehren }, 'alle daten ersetzen'),
            el('button', { class: 'knopf leise', type: 'button', onclick: () => { importVorschau = null; zeige(); } }, 'abbrechen')))
      : el('div', { class: 'hinweis warn', style: 'margin-top:12px' }, el('p', { style: 'margin:0 0 10px' }, importVorschau.fehler),
          el('button', { class: 'knopf mini leise', type: 'button', onclick: () => { importVorschau = null; zeige(); } }, 'ok'));
  }
  const daten = el('div', { class: 'karte' },
    el('h2', null, 'Sichern und umziehen'),
    el('p', { class: 'mu' }, 'Alles bleibt auf deinem Gerät. Wer die Browserdaten löscht, löscht auch die Liste. Sichere deshalb ab und zu als Datei.'),
    el('p', { class: 'klein' }, 'letzter export: ' + (le ? fmtDatum(le) : 'noch nie') + ' · ' + D.personen.length + ' personen · ' + D.getraenke.length + ' getränke · ' + D.striche.length + ' striche'),
    el('div', { class: 'reihe' },
      el('button', { class: 'knopf haupt', type: 'button', onclick: exportieren }, 'exportieren (json)'),
      el('button', { class: 'knopf', type: 'button', onclick: () => datei.click() }, 'importieren'), datei,
      el('a', { class: 'knopf', href: '#teilen' }, 'mehrere handys')),
    vorschau);

  /* Darstellung */
  let t = 'auto';
  try { t = localStorage.getItem('strich-theme') || 'auto'; } catch (e) {}
  const setzeTheme = w => {
    try { if (w === 'auto') localStorage.removeItem('strich-theme'); else localStorage.setItem('strich-theme', w); } catch (e) {}
    if (w === 'hell') document.documentElement.dataset.theme = 'light';
    else if (w === 'dunkel') document.documentElement.dataset.theme = 'dark';
    else delete document.documentElement.dataset.theme;
    zeige();
  };
  const darstellung = el('div', { class: 'karte' },
    el('h2', null, 'Darstellung'),
    el('div', { class: 'seg', role: 'group', 'aria-label': 'Farbschema' },
      ['auto', 'hell', 'dunkel'].map(w => el('button', { type: 'button', 'aria-pressed': String(t === w), onclick: () => setzeTheme(w) }, w))),
    el('p', { class: 'klein', style: 'margin-top:14px' }, 'strich. · kein konto · kein server · keine werbung · agpl-3.0'));

  return el('section', { class: 'spalten' },
    el('div', null, personen, getraenke),
    el('div', null, beispiel, daten, darstellung));
}

/* ---------- Start ---------- */
window.addEventListener('hashchange', () => { zeige(); window.scrollTo(0, 0); });
let breitVorher = matchMedia('(min-width:1280px)').matches;
matchMedia('(min-width:1280px)').addEventListener('change', e => { if (e.matches !== breitVorher) { breitVorher = e.matches; zeige(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && auswahl) { auswahl = null; zeige(); }
});

laden().then(zeige);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
